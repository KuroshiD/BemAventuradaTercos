services:
  api1: 
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api1
    depends_on:
      - db
    volumes:
    - .:/usr/src/app
    - /usr/src/app/dist
    expose:
      - "3001"
    environment:
      - TIMEZONE=America/Sao_Paulo
      - DB_HOST=db
      - DB_PORT=5432
      - DB=db_api
      - DB_USER=db_user
      - DB_PASS=db_pass

  api2: 
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api2
    depends_on:
      - db
    volumes:
    - .:/usr/src/app
    - /usr/src/app/dist
    expose:
      - "3001"
    environment:
      - TIMEZONE=America/Sao_Paulo
      - DB_HOST=db
      - DB_PORT=5432
      - DB=db_api
      - DB_USER=db_user
      - DB_PASS=db_pass

  nginx: 
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    ports:
      - "${NGINX_PORT:-80}:80"
  

  db:
    image: postgres
    environment:
      POSTGRES_DB: ${DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - db
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@bemaventurada.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin_servers.json:/pgadmin4/servers.json:ro
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  db_data: {}
  pgadmin_data: {}

